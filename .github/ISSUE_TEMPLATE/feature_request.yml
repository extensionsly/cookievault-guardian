name: Feature request
description: Suggest an improvement or a new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: >
        Describe the situation you run into, not just the solution you have in
        mind. Concrete workflows help us weigh it against other work.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds you have tried

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: >
            I understand CookieVault ships as two focused extensions (Editor for
            manual cookie editing, Guardian for automatic cleanup) and this
            request fits the scope of this one.
          required: true
