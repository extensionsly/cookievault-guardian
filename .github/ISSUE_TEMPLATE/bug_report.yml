name: Bug report
description: Something in the extension is broken or behaves unexpectedly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        **Do not report security vulnerabilities here.** Please follow
        [SECURITY.md](../blob/main/SECURITY.md) and report privately instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the popup on ...
        2. Click ...
        3. See error
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Edge
        - Firefox
        - Brave
        - Other Chromium-based
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Browser and extension version
      placeholder: "Chrome 141.0.7390.55 / CookieVault 0.1.0"
    validations:
      required: true

  - type: dropdown
    id: install-source
    attributes:
      label: How did you install it?
      options:
        - From a browser store (official listing)
        - Built from source in this repository
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Console output (optional)
      description: >
        Errors from the extension's console, if any. Please redact cookie
        values, tokens, and anything else sensitive before pasting.
      render: text
